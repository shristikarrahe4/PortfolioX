<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - PortfolioX</title>
<meta name="description" content="PortfolioX helps students build a professional portfolio, check readiness and prepare for internships and placements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="forgot">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">PX</span>PortfolioX</a>
    <h1>Reset your password</h1>
    <p class="muted">Enter your email and we will send you a reset link.</p>
    <div id="form-msg" class="msg" role="alert" hidden></div>
    <form id="auth-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </form>
    
    <div class="auth-links"><a href="/login.html">Back to log in</a></div>
  </div>
</main>
<script src="/vendor/supabase.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
