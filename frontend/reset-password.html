<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - PortfolioX</title>
<meta name="description" content="PortfolioX helps students build a professional portfolio, check readiness and prepare for internships and placements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="reset">
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">PX</span>PortfolioX</a>
    <h1>Choose a new password</h1>
    <p class="muted">Enter a new password for your account.</p>
    <div id="form-msg" class="msg" role="alert" hidden></div>
    <form id="auth-form" novalidate hidden>
      <div class="field"><label for="password">New password</label>
        <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" required><button class="toggle-pw" type="button" data-target="password" aria-pressed="false">Show</button></div></div>
      <p class="hint">At least 8 characters with letters and numbers.</p>
      <div class="field"><label for="confirm">Confirm new password</label>
        <div class="pw-wrap"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><button class="toggle-pw" type="button" data-target="confirm" aria-pressed="false">Show</button></div></div>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
    <p id="request-new" hidden><a class="btn btn-primary" href="/forgot-password.html">Request a new link</a></p>
    <div class="auth-links"><a href="/login.html">Back to log in</a></div>
  </div>
</main>
<script src="/vendor/supabase.js"></script>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
