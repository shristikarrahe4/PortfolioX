<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievements - PortfolioX</title>
<meta name="description" content="PortfolioX helps students build a professional portfolio, check readiness and prepare for internships and placements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="achievements">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button id="menu-btn" class="icon-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
  <span class="brand">PortfolioX</span>
</header>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <main id="main" class="main">

    <div class="page-head"><div><h1>Achievements and certifications</h1><p class="muted">Record only achievements you have genuinely earned.</p></div>
      <button id="add-btn" class="btn btn-primary" type="button">+ Add achievement</button></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="ach-list" class="grid-auto"></div>
    <dialog id="ach-dialog" aria-labelledby="dialog-title"><div class="dialog-body">
      <h2 id="dialog-title">Add achievement</h2>
      <form id="ach-form" novalidate>
        <div class="form-grid">
<div class="field full"><label for="title">Achievement or certificate title <span class="req" aria-hidden="true">*</span></label><input id="title" name="title" type="text" required maxlength="120"></div>
<div class="field"><label for="organization">Issuing organisation <span class="req" aria-hidden="true">*</span></label><input id="organization" name="organization" type="text" required maxlength="120"></div>
<div class="field"><label for="category">Category <span class="req" aria-hidden="true">*</span></label><select id="category" name="category" required><option value="">Choose category</option></select></div>
<div class="field"><label for="earned_on">Date earned <span class="req" aria-hidden="true">*</span></label><input id="earned_on" name="earned_on" type="date" required ></div>
<div class="field"><label for="credential_url">Credential / verification URL</label><input id="credential_url" name="credential_url" type="url" ><p class="hint">Optional. PortfolioX does not verify credentials.</p></div>
<div class="field full"><label for="description">Short description</label><textarea id="description" name="description" maxlength="400"></textarea><p class="hint">Up to 400 characters.</p></div>
        </div>
        <div class="check"><input id="is_public" name="is_public" type="checkbox"><label for="is_public">Show on my public portfolio</label></div>
        <div class="dialog-actions"><button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save achievement</button></div>
      </form></div></dialog>
  </main>
</div>
<div id="scrim" class="scrim"></div>
<script src="/vendor/supabase.js"></script>
<script src="/js/common.js"></script>
<script src="/js/achievements.js"></script>
</body>
</html>
